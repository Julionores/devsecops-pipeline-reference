server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité de base (défense en profondeur, en complément de Helmet côté API).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.html;
    }

    location = /api/health {
        return 404; # le frontend ne proxifie pas l'API dans ce projet de démo - voir README
    }
}
