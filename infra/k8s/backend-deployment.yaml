# Manifeste d'exemple pour un déploiement Kubernetes du backend.
# Non déployé automatiquement par ce pipeline (le CD de référence déploie via
# Docker Compose sur un hôte de staging - voir docs/pipeline-architecture.md) :
# fourni ici comme cible de scan IaC (Checkov) et comme base pour une évolution
# vers un déploiement Kubernetes / GitOps (ArgoCD).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-tracker-backend
  labels:
    app: compliance-tracker-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compliance-tracker-backend
  template:
    metadata:
      labels:
        app: compliance-tracker-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/julionores/compliance-tracker-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: CORS_ALLOWED_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: compliance-tracker-config
                  key: cors-allowed-origin
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-tracker-backend
spec:
  selector:
    app: compliance-tracker-backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: compliance-tracker-config
data:
  cors-allowed-origin: "https://compliance-tracker.example.com"
